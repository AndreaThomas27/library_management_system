{% extends "base.html" %}
{% block title %}Add Book - Library System{% endblock %}
{% block content %}
<a href="{{ url_for('admin_books') }}" class="back-link">&larr; Back to Books</a>

<div class="form-card">
    <h1>Add New Book</h1>
    <p class="subtitle">A QR code will be generated automatically for this book.</p>

    <form method="POST" action="{{ url_for('admin_add_book') }}" class="auth-form">
        <div class="form-row">
            <div class="form-group">
                <label for="book_code">Book Code *</label>
                <input type="text" id="book_code" name="book_code" required placeholder="e.g. BOOK011">
            </div>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="e.g. 9780000000000">
            </div>
        </div>

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="author">Author *</label>
                <input type="text" id="author" name="author" required>
            </div>
            <div class="form-group">
                <label for="category">Category *</label>
                <input type="text" id="category" name="category" required placeholder="e.g. Fiction">
            </div>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity *</label>
            <input type="number" id="quantity" name="quantity" min="1" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Add Book</button>
    </form>
</div>
{% endblock %}
